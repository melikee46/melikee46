<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20">
  <defs>
    <style>
      .line { stroke: #e6e2d8; stroke-width: 1; }
      .dot { fill: #c8372d; }

      @media (prefers-color-scheme: dark) {
        .line { stroke: #262626; }
      }
    </style>
  </defs>

  <!-- Hairline with quiet margins -->
  <line x1="200" y1="10" x2="1000" y2="10" class="line" />

  <!-- Tiny center circle -->
  <circle cx="600" cy="10" r="2.5" class="dot" />
</svg>
