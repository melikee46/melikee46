<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <style>
      .bg { fill: #f7f5f0; }
      .circle { fill: #c8372d; transform-origin: center; animation: breathe 6s ease-in-out infinite; }
      .kanji { fill: #2c2825; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans CJK JP", "Meiryo", sans-serif; font-size: 72px; font-weight: 200; }
      .name { fill: #1f1d1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 26px; font-weight: 200; letter-spacing: 0.22em; }
      .subtitle { fill: #757068; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; font-weight: 300; letter-spacing: 0.14em; }

      @keyframes breathe {
        0%, 100% { transform: scale(0.96); }
        50% { transform: scale(1.04); }
      }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #111111; }
        .kanji { fill: #e5e2dc; }
        .name { fill: #eeeeee; }
        .subtitle { fill: #9a958e; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Vermilion breathing circle -->
  <g transform="translate(600, 72)">
    <circle cx="0" cy="0" r="26" class="circle">
      <animateTransform
        attributeName="transform"
        type="scale"
        values="0.96; 1.04; 0.96"
        keyTimes="0; 0.5; 1"
        dur="6s"
        repeatCount="indefinite"
      />
    </circle>
  </g>

  <!-- Large kanji 間 -->
  <text x="600" y="152" text-anchor="middle" class="kanji">間</text>

  <!-- Name and subtitle -->
  <text x="600" y="210" text-anchor="middle" class="name">MELIKE ARSLAN</text>
  <text x="600" y="246" text-anchor="middle" class="subtitle">software engineer — and the space between things</text>
</svg>
